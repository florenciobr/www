
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primera página</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #f2f5f9;
      color: #1d3557;
      padding: 60px 20px;
    }
    .tarjeta {
      background: white;
      max-width: 600px;
      margin: auto;
      padding: 35px;
      border-radius: 16px;
      box-shadow: 0 5px 20px #0001;
    }
    a {
      display: inline-block;
      background: #1769ff;
      color: white;
      padding: 12px 22px;
      border-radius: 8px;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="tarjeta">
    <h1>¡Bienvenido a mi página!</h1>
    <p>Mi sitio web está publicado en GitHub Pages.</p>
    <a href="https://github.com/">Conocer GitHub</a>
  </div>
</body>
</html>
